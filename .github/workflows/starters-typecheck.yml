name: Starter smoke tests

on:
  push:
    branches: [main]
    paths:
      - "code/**"
      - ".github/workflows/starters-typecheck.yml"
  pull_request:
    paths:
      - "code/**"
      - ".github/workflows/starters-typecheck.yml"

jobs:
  typecheck:
    name: tsc --noEmit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every starter that has a package.json + lockfile + tsconfig.
        # Starters without one (week-06, week-07) are illustrative snippets.
        project:
          - code/capstone-playwright-healer
          - code/module-12-multi-agent
          - code/module-14-idp
          - code/week-02-first-api-call
          - code/week-10-rag-pgvector
          - code/week-15-mcp-agent
          - code/week-18-browser-agent
          - code/week-20-ai-test-generator
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      # tsc does not launch a browser. Skip the Playwright download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
